{% set name = "bqplot-gl" %}
{% set version = "0.1.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: e70cfca5c2d6f96959dcdcb254a01e5006617f1401a85f35977fae96232251dc

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatch
    - hatchling
    - hatch-nodejs-version
    - hatch-build-scripts
    - jupyterlab
    - setuptools
    - hatch-jupyter-builder >=0.8.1
    - nodejs 24.*
    - yarn
  run:
    - python >={{ python_min }}
    - bqplot >=0.13,<0.14

test:
  imports:
    - bqplot_gl
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/bqplot/bqplot-gl
  summary: Plugin to bqplot powered by WebGL.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - martinRenou
    - giswqs
